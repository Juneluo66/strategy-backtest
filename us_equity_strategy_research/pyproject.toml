[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-equity-strategy-research"
version = "0.1.0"
description = "US equity multifactor / momentum / PEAD vs frozen ETF dual-momentum audit"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "yfinance>=0.2.50",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
us-equity-research = "us_equity_strategy_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
lint.ignore = ["UP045"]

[tool.setuptools.packages.find]
where = ["src"]
