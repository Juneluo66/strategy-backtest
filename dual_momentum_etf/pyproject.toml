[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-momentum-etf"
version = "0.1.0"
description = "US ETF dual-momentum with category constraint, vol adjustment, and trend filter"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dual-momentum-etf = "dual_momentum_etf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
lint.ignore = ["UP045"]

[tool.setuptools.packages.find]
where = ["src"]
