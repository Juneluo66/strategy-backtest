[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-regime-cross-asset-v2"
version = "0.1.0"
description = "Research v2: BTC regime gate × risk-on/off ETF matrix (does not modify v1)"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "yfinance>=0.2.50",
  "ccxt>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
btc-regime-v2 = "btc_regime_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
