# IBKR live v1 — connection only; strategy rules remain in frozen.yaml
enabled: true
mode: paper  # paper | live — user must match Gateway login

connection:
  host: "127.0.0.1"
  port: 4001      # live Gateway; paper = 4002
  client_id: 11
  timeout_sec: 30
  readonly: false

account:
  # Leave empty to use first managed account
  account_id: ""

strategy:
  rule_id: BTC50_MOM20_QQQ_SHY_v1
  risk_on_symbol: QQQ
  risk_off_symbol: SHY
  exchange: SMART
  currency: USD
  target_pct: 1.0   # 100% of pool NAV in target sleeve
  fractional_shares: false  # IBKR API rejects fractional for this account (Error 10243)
  min_order_usd: 0.0
  # Weekly cron runs at US open → market orders.
  order_type: MKT
  order_tif: DAY
  limit_buy_cushion_bps: 50
  limit_sell_cushion_bps: 50
  outside_rth: false

capital_pool:
  state_path: reports/live/capital_pool.json
  auto_lock_cash: false
  require_explicit_capital_amount: true
  require_confirm_before_trade: true

ledger:
  path: reports/live/live_nav_ledger.csv
  initial_nav_path: reports/live/initial_nav.json
  report_path: reports/live/live_performance.md

schedule:
  # Monday US session — DST via America/New_York (not approximate Beijing-only times).
  # Cron starts 08:45 ET (signal + 2FA early); trades at/after 09:35 ET.
  # Beijing: start 20:45 (EDT) / 21:45 (EST); open 21:30 (EDT) / 22:30 (EST).
  timezone: America/New_York
  rebalance_weekday: Monday
  rebalance_after_hour: 9
  rebalance_after_minute: 35
  trade_window_end_hour: 11
  gateway_on_demand: true
  # Cron: scripts/install_weekly_cron.sh → Mon 08:45 ET

git:
  auto_push: true
  commit_prefix: "live(v1):"
