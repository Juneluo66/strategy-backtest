# IBKR live v1 — connection only; strategy rules remain in frozen.yaml
enabled: true
mode: paper  # paper | live — user must match Gateway login

connection:
  host: "127.0.0.1"
  port: 4001      # live Gateway; paper = 4002
  client_id: 11
  timeout_sec: 30
  readonly: false

account:
  # Leave empty to use first managed account
  account_id: ""

strategy:
  rule_id: BTC50_MOM20_QQQ_SHY_v1
  risk_on_symbol: QQQ
  risk_off_symbol: SHY
  exchange: SMART
  currency: USD
  target_pct: 1.0   # 100% of pool NAV in target sleeve
  fractional_shares: true   # IBKR fractional / cashQty orders
  min_order_usd: 0.0        # 0 = disabled (IBKR enforces its own minimums)

capital_pool:
  state_path: reports/live/capital_pool.json
  # Only explicit live-inject-capital may increase pool beyond P&L.
  require_confirm_before_trade: true

ledger:
  path: reports/live/live_nav_ledger.csv
  initial_nav_path: reports/live/initial_nav.json
  report_path: reports/live/live_performance.md

schedule:
  # Week-start rebalance proxy (America/New_York); cron should run after US market open
  timezone: America/New_York
  rebalance_weekday: Monday
  rebalance_after_hour: 9
  rebalance_after_minute: 35

git:
  auto_push: true
  commit_prefix: "live(v1):"
