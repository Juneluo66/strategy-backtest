[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-ma-qqq-shy"
version = "0.1.0"
description = "Weekly BTC 50DMA + 20d momentum gate: QQQ vs SHY (email claim audit)"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "yfinance>=0.2.50",
  "ccxt>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["ib_insync>=0.9.86", "python-dotenv>=1.0"]

[project.scripts]
btc-ma-qqq = "btc_ma_qqq_shy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
