[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-dividend-lowvol-quality"
version = "0.1.0"
description = "Point-in-time A-share dividend, low-volatility, quality strategy backtest"
requires-python = ">=3.9"
dependencies = [
  "akshare>=1.18",
  "baostock>=0.8.9",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dividend-lowvol = "strategy_backtest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.setuptools.packages.find]
where = ["src"]
