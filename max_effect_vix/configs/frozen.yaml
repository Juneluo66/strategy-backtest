version: "max_robustness_free_v1"
signal_lookback_days: 21
top_returns: 5
min_price: 5.0
min_market_cap: 1000000000
min_dollar_volume: 5000000
portfolio_decile: 0.10
max_portfolio_size: 25
rebalance: monthly_first_trading_day
execution: next_session_open
benchmark: SPY
vix:
  symbol: "^VIX"
  low: 15.0
  high: 30.0
  low_leverage: 1.5
  high_leverage: 1.0
costs:
  one_way_bps: 5.0
  stress_one_way_bps: [0.0, 5.0, 10.0, 20.0]
  annual_margin_rate: 0.05
  annual_spy_borrow_rate: 0.003
  impact_coefficient_bps: 10.0
  max_adv_participation: 0.01
  assumed_portfolio_value: 1000000
variants:
  baseline_1x: {vix_mode: none}
  vix_deleverage: {vix_mode: deleverage_only, range: "1.0x to 0.667x; normalized original rule"}
  vix_original: {vix_mode: original}
research_windows:
  in_sample: ["1998-01-01", "2016-12-31"]
  validation: ["2017-01-01", "2023-12-31"]
  locked_oos: ["2024-01-01", "2026-06-30"]
free_data:
  status: SURVIVORSHIP_BIASED_PILOT
  start: "2015-01-01"
  universe_source: "Wikipedia current S&P 500 constituents"
  fallback_symbols: 100
  historical_provider: historical_sp500_wikipedia
  DATA_TIER: HISTORICAL_SP500_APPROX
  SURVIVORSHIP_BIAS: REDUCED_NOT_ELIMINATED
  PIT_VALIDATED: false
  DELISTING_RETURN: UNAVAILABLE
  SIZE_NEUTRAL: BLOCKED_BY_PIT_MARKET_CAP
neutralization:
  volatility_lookback_days: 63
  beta_lookback_days: 252
  beta_min_observations: 126
  winsor_limits: [0.025, 0.975]
  variants: [raw, vol_neutral, beta_neutral, beta_hedged, size_neutral]
robustness:
  top_returns: [1, 3, 5]
  portfolio_sizes: [15, 25, 35, 50]
